services:
  - type: web
    name: mimora-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22.17.1
